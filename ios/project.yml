name: BridgeDeck
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftADB:
    url: https://github.com/akshaynexus/SwiftADB.git
    revision: 1044bec57ee3aef4b7c556fce2e76b24257769e5
targets:
  BridgeDeck:
    type: application
    platform: iOS
    sources:
      - BridgeDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.bridgedeck
        PRODUCT_NAME: BridgeDeck
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: BridgeDeck/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftADB
