name: BridgeDeck Android TV
on:
  push:
    branches: [main]
    paths:
      - "androidtv/**"
      - ".github/workflows/androidtv.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build companion APK
        working-directory: androidtv
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeDeck-TV-debug
          path: androidtv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
